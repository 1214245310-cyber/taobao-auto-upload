# 默认即生产配置（服务器 systemd 不指定 profile 时走这里）
# 本地开发请改用 profile：
#   dev   -> 内存库，重启清空，开 H2 控制台
#   local -> 文件库，数据保留，开 H2 控制台
server:
  port: 8081
spring:
  application:
    name: loa-backend
  datasource:
    url: jdbc:h2:file:./data/loa;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  # QQ 邮箱 SMTP。账号与授权码从环境变量读取，不写进仓库。
  # LOA_MAIL_USERNAME=你的QQ邮箱@qq.com   LOA_MAIL_PASSWORD=16位授权码
  mail:
    host: smtp.qq.com
    port: 465
    username: ${LOA_MAIL_USERNAME:}
    password: ${LOA_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
loa:
  parse:
    provider: mock
    third-party:
      base-url: ""
      access-token: ""
  admin:
    username: admin
    password: admin123
  session:
    ttl-seconds: 7200
  mail:
    # 发件人必须与上面的 username 一致，QQ 邮箱会校验
    from: ${LOA_MAIL_USERNAME:}
    from-name: LOA 淘宝上货系统
logging:
  level:
    root: INFO
    com.loa: INFO
  file:
    name: /opt/loa/logs/loa-api.log
